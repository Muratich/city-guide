services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-city_guide}
      POSTGRES_USER: ${POSTGRES_USER:-city_guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-city_guide}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-city_guide} -d ${POSTGRES_DB:-city_guide}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    entrypoint: ["/app/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-city_guide}:${POSTGRES_PASSWORD:-city_guide}@postgres:5432/${POSTGRES_DB:-city_guide}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-city_guide}:${POSTGRES_PASSWORD:-city_guide}@postgres:5432/${POSTGRES_DB:-city_guide}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: