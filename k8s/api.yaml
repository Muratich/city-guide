apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cityguide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: migrate
          image: city-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cityguide-secret
                  key: DATABASE_URL
      containers:
        - name: api
          image: city-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cityguide-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cityguide
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000