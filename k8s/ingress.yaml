apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cityguide
  namespace: cityguide
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http