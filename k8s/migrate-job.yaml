apiVersion: batch/v1
kind: Job
metadata:
  name: cityguide-migrate
  namespace: cityguide
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: city-backend:lf
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cityguide-secret
                  key: DATABASE_URL
