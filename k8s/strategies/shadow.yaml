apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: cityguide
spec:
  parentRefs:
    - name: cityguide
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          method: GET
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: api-green
              port: 8000
      backendRefs:
        - name: api-blue
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-blue
          port: 8000
