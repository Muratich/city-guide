apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: mailpit.monitoring.svc:1025
      smtp_from: alerts@city-guide.local
      smtp_require_tls: false
    route:
      receiver: mailpit
      group_by: [alertname]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: mailpit
        email_configs:
          - to: alerts@city-guide.local
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
