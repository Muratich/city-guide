global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cityguide-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: cityguide-prober
    static_configs:
      - targets: ["api-prober:8001"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]
